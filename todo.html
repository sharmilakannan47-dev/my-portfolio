<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<style>
body { font-family: Arial; background: #eaf0ff; padding: 30px; }
.container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
h1 { color: #2457c5; text-align: center; }
input { padding: 10px; }
button { padding: 10px; background: #2457c5; color: white; border: 0; cursor: pointer; margin: 4px; }
li { margin: 12px 0; }
.done { text-decoration: line-through; color: gray; }
</style>
</head>
<body>
<div class="container">
<h1>My To-Do List</h1>
<input id="taskInput" placeholder="Enter a task">
<button onclick="addTask()">Add Task</button>
<ul id="taskList"></ul>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach((task, i) => {
    const li = document.createElement("li");
    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.done;
    check.onchange = () => {
      tasks[i].done = check.checked;
      saveTasks();
      renderTasks();
    };
    const span = document.createElement("span");
    span.textContent = task.text;
    if (task.done) span.className = "done";
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = () => {
      tasks.splice(i, 1);
      saveTasks();
      renderTasks();
    };
    li.append(check, span, del);
    list.appendChild(li);
  });
}

function addTask() {
  const input = document.getElementById("taskInput");
  if (!input.value.trim()) return;
  tasks.push({ text: input.value.trim(), done: false });
  input.value = "";
  saveTasks();
  renderTasks();
}

document.getElementById("taskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});
renderTasks();
</script>
</body>
</html>
